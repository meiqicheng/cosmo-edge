# CosmoEdge AX650N 包构建。
#
# builder 镜像完全自包含（见 Dockerfile.axera）：ARM GNU gcc-arm-9.2
# 工具链与 AX650 SDK V3.10.2 msp/out 运行时（仅 lib/include）在镜像
# 构建时从官方源下载，不需要本地 bind mount。
#
# 用法：
#   docker compose -f docker-compose.axera.yml build
#   docker compose -f docker-compose.axera.yml run --rm cosmo-axera-package --chip ax650n
# 输出落在 ./build_output/ax650n/。

services:
  cosmo-axera-package:
    image: ${COSMO_AXERA_BUILDER_IMAGE:-cosmo_edge-build-env_axera:local}
    build:
      context: .
      dockerfile: Dockerfile.axera
    platform: linux/amd64
    network_mode: host
    volumes:
      - .:/workspace
      - ./build_output:/build_output
      - cosmo-axera-build:/opt/axera/build
      - cosmo-npm-cache:/root/.npm
    working_dir: /workspace
    environment:
      COSMO_BUILD_JOBS: "${COSMO_BUILD_JOBS:-4}"
      COSMO_PACKAGE_MODELS: "${COSMO_PACKAGE_MODELS:-include}"
      COSMO_AXERA_BUILD_DIR: "/opt/axera/build"
      NPM_CONFIG_MAXSOCKETS: "${NPM_CONFIG_MAXSOCKETS:-1}"
      NPM_CONFIG_PROGRESS: "${NPM_CONFIG_PROGRESS:-false}"
      NPM_CONFIG_FETCH_RETRIES: "${NPM_CONFIG_FETCH_RETRIES:-3}"
      NPM_CONFIG_FETCH_TIMEOUT: "${NPM_CONFIG_FETCH_TIMEOUT:-120000}"
      NPM_CONFIG_PREFER_OFFLINE: "${NPM_CONFIG_PREFER_OFFLINE:-true}"
      NPM_CONFIG_UPDATE_NOTIFIER: "${NPM_CONFIG_UPDATE_NOTIFIER:-false}"
    entrypoint: ["/workspace/scripts/build_axera_package.sh"]
    command:
      - --chip
      - ${COSMO_TARGET_CHIP:-ax650n}
      - --models
      - ${COSMO_PACKAGE_MODELS:-include}

volumes:
  cosmo-axera-build:
  cosmo-npm-cache:
