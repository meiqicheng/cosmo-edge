name: longrun_dualcv_24h_8ch
displayName: RK3588 双 CV 8 路 24 小时长稳（每任务 5FPS）
sampleIntervalSec: 60

channels:
  mode: local
  repeatCount: 0
  sources:
    - name: no-helmet-01
      file: ../LX0000000007.mp4

tasks:
  - id: person-detector
    displayName: 人员检测
    type: cv
    algorithmId: "7463"
    scheduleId: "e89c6c6385e5454b35cde0d1653vg"
    template: ../algorithm-template-7463.json
    targetFps: 5
    taskConfig:
      params:
        - key: param.videoReadFps
          value: "5"
        - key: param.videoRepeatCount
          value: "0"
        - key: param.targetAlarmInterval
          value: "36000"
        - key: param.targetAlarmCount
          value: "1"
        - key: param.restrainSwitch
          value: "1"
        - key: param.sensitivity
          value: "1"
        - key: param.detectionDuration
          value: "3600"
  - id: no-safety-helmet
    displayName: 未戴安全帽分析
    type: cv
    algorithmId: "7463002"
    scheduleId: "e89c6c6385e5454b35cde0d1653vg"
    template: ../algorithm-template-7463002.json
    targetFps: 5
    taskConfig:
      params:
        - key: param.videoReadFps
          value: "5"
        - key: param.videoRepeatCount
          value: "0"

bindings:
  - task: person-detector
    channels: all
  - task: no-safety-helmet
    channels: all

loadProfile:
  - channels: 8
    holdSec: 86400

thresholds:
  pass:
    maxCriticalPathLatencyMs: 200
    maxDetectorLatencyMs: 150
    avgDiscardRate: 0
    maxPacketDiscardRate: 0
    maxDiskUsedPercent: 90
  taskTypes:
    cv:
      minFpsRatio: 0.8
      maxMissingRate: 0
