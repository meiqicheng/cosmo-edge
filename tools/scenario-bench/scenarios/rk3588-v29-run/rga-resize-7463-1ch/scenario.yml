name: rk3588-rga-resize-7463-1ch
displayName: RK3588 RGA回归 解码缩放路径(2560x1440→NeedsResize→ResizeWithRga) 1通道 5FPS
sampleIntervalSec: 3

channels:
  mode: local
  repeatCount: 0
  sources:
    # 2560x1440 = 3686400 px > kVideoDefaultWidth*Height (1920*1088 = 2090752)
    # => AlgChannelDecode::NeedsResize() == true
    # => IVideoFrameTransform::Resize -> VideoFrameProcRockchip::Resize
    #    -> ResizeWithRga -> RunRgaWithDma32Staging（本次去重的函数）
    # 现有两个 1920x1080 素材都小于阈值，无法触发该路径。
    - name: rga-resize-src
      file: ../LX0000000007-2560x1440.mp4

tasks:
  - id: person-detector
    displayName: 人员检测
    type: cv
    algorithmId: "7463"
    scheduleId: "e89c6c6385e5454b35cde0d1653vg"
    template: ../algorithm-template-7463.json
    targetFps: 5
    taskConfig:
      params:
        - key: param.targetAlarmInterval
          value: "36000"
        - key: param.targetAlarmCount
          value: "1"
        - key: param.restrainSwitch
          value: "1"
        - key: param.sensitivity
          value: "1"
        - key: param.detectionDuration
          value: "3600"
loadProfile:
  - channels: 1
    holdSec: 90

thresholds:
  pass:
    maxCriticalPathLatencyMs: 200
    maxDetectorLatencyMs: 150
    avgDiscardRate: 0.05
    maxPacketDiscardRate: 0.01
    maxDiskUsedPercent: 90
  taskTypes:
    cv:
      minFpsRatio: 0.8
      maxMissingRate: 0
