version: 2
name: person-detector-fps-gradient
displayName: Person detector 24/10/7/5 FPS staircase
sampleIntervalSec: 3

channels:
  mode: local
  repeatCount: 0
  sources:
    - name: public-1080p24-sample
      file: "../../dataset/controlled-1080p24-sample.mp4"

tasks:
  - id: person-detector
    displayName: Person detector
    type: cv
    modelRef: "../../models/<platform>.json#person-detector"
    targetFps: "<24|10|7|5>"

bindings:
  - task: person-detector
    channels: all

loadProfile:
  - channels: "1..<platform-maximum>"
    holdSec: 30

thresholds:
  pass:
    avgDiscardRate: 0.05
  taskTypes:
    cv:
      minFpsRatio: 0.8
      maxMissingRate: 0
