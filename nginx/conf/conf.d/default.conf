
upstream mvit {
    server 127.0.0.1:8000;
}

upstream mvws {
    server 127.0.0.1:9000;
}

server {
    listen 80;
    server_name localhost;
    #root /appfs/cosmo_wander/cwai_data/web/dist/;
    #index index.html;

    #location / {
    #    try_files $uri $uri/ /index.html last;
    #}

    # Vite emits content-hashed files below /assets. A missing file belongs to
    # an older frontend build and must stay a 404; returning index.html here
    # makes browsers reject the JavaScript module as text/html.
    location ^~ /assets/ {
        root   /appfs/cosmo_wander/cwai_data/web/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    # index.html binds one exact set of hashed assets. Never retain it across
    # an upgrade, otherwise an old entry page requests deleted chunks.
    location = /index.html {
        root   /appfs/cosmo_wander/cwai_data/web/;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        root   /appfs/cosmo_wander/cwai_data/web/;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET,POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
    }

    location /staticfile {
        alias /appfs/cosmo_wander/cwai_data/web/staticfile;
    }


    location ~* ^/gtw/cwai/ {
        client_max_body_size 1024m;
        # 大文件/分片上传：避免 nginx 将请求体落盘到默认 client_body_temp_path 导致 500
        # 需要确保该目录存在且可写（建议放在持久盘而不是 /tmp tmpfs）
        client_body_temp_path @COSMO_DATA_DIR@/tmp/nginx_body 1 2;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://mvit;
        proxy_read_timeout 3600s;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X_Real_IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # add_header 'Access-Control-Allow-Origin' '*' always;
    }

    location ~* ^/v1/cwai/aihost/ {
        client_max_body_size 1024m;
        client_body_temp_path @COSMO_DATA_DIR@/tmp/nginx_body 1 2;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://mvit;
        proxy_read_timeout 3600s;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X_Real_IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # add_header 'Access-Control-Allow-Origin' '*' always;
    }

    location /event {
        # Disable cache
        add_header Cache-Control no-cache;

        # CORS setup
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length';

        # Preserve the standard mime.types mapping by file extension. This
        # serves JPEG/PNG snapshots with image/* and MP4 recordings with
        # video/mp4 instead of overriding every non-MP4 response as text/plain.

        # allow CORS preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Length' 0;
            return 204;
        }

        error_page 404 = /staticfile/404.jpg;

        alias @COSMO_DATA_DIR@/event;
    }

    location /web {
        # Disable cache
        add_header Cache-Control no-cache;

        # CORS setup
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length';

        # Content-Type is selected by the shared mime.types table.

        # allow CORS preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Length' 0;
            return 204;
        }

        error_page 404 = /staticfile/404.jpg;

        alias @COSMO_DATA_DIR@/web;
    }

    location @COSMO_DATA_DIR@/camera {
        # Disable cache
        add_header Cache-Control no-cache;

        # CORS setup
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length';

        # Content-Type is selected by the shared mime.types table.

        # allow CORS preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Length' 0;
            return 204;
        }

        error_page 404 = /staticfile/404.jpg;

        alias @COSMO_DATA_DIR@/camera;
    }

    location /weblogo {
        # Disable cache
        add_header Cache-Control no-cache;

        # CORS setup
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length';

        # allow CORS preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        error_page 404 = /staticfile/404.jpg;

        alias @COSMO_DATA_DIR@/weblogo;
    }

    location /audioMng {
        # Disable cache
        add_header Cache-Control no-cache;

        # CORS setup
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length';

        # allow CORS preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        error_page 404 = /staticfile/404.jpg;

        alias @COSMO_DATA_DIR@/audioMng;
    }

    location /weblibPic {
        # Disable cache
        add_header Cache-Control no-cache;

        # CORS setup
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length';

        # allow CORS preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        error_page 404 = /staticfile/404.jpg;

        alias @COSMO_DATA_DIR@/weblibPic;
    }

    location ~* ^/wsInterface/ {
        client_max_body_size 1024m;
        proxy_pass http://mvws;
        proxy_read_timeout 3600s;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X_Real_IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # add_header 'Access-Control-Allow-Origin' '*' always;
    }
}
